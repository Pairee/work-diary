name: smoke

on:
  push:
  pull_request:
  workflow_dispatch:

# 시험은 코드를 읽기만 한다.
permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 설치부터 지우기까지 한 바퀴
        run: python tests/smoke.py
